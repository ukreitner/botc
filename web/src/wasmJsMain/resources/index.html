<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Clocktower Grimoire</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grimoire">
<meta name="theme-color" content="#0E0A14">
<link rel="apple-touch-icon" href="appicon.png">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0E0A14; overflow: hidden; }
  /* Full-bleed canvas; the measured safe-area insets are passed INTO
     Compose (window.__safeTop/__safeBottom) so the app paints its own
     background under the notch and pads its content — no black bands,
     no content under the status bar or home indicator. */
  #compose {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    outline: none;
    overflow: hidden;
    /* Let Compose own every gesture: no browser pinch/double-tap zoom,
       no grey tap flashes, no accidental text selection. */
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  #boot {
    position: fixed; inset: 0; display: flex; flex-direction: column; gap: 10px;
    align-items: center; justify-content: center;
    color: #D9B45B; font-family: Georgia, serif; font-size: 22px;
  }
  #boot small { color: #B9AECB; font-size: 13px; }
</style>
</head>
<body>
<div id="boot">Opening the grimoire…<small>first load fetches the whole app; later loads are instant</small><small>build __BUILD__</small></div>
<div id="compose"></div>
<script>
  // The build this shell was deployed from; the app footer reads it so
  // "did my fix ship?" is answerable at the table (setup-and-home #40).
  window.__BUILD__ = '__BUILD__';

  // ---- service worker + update prompt (setup-and-home #40, #44) ----------
  // The worker no longer calls skipWaiting() on its own; a new version waits
  // until the storyteller taps Reload, so a running game never has its cache
  // swapped out from under it mid-night.
  window.__updateReady = false;
  window.__applyUpdate = function () {
    try {
      if (window.__waitingWorker) window.__waitingWorker.postMessage('SKIP_WAITING');
      else window.location.reload();
    } catch (e) { window.location.reload(); }
  };
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').then(function (registration) {
      function ready(worker) {
        if (worker.state === 'installed' && navigator.serviceWorker.controller) {
          window.__waitingWorker = worker;
          window.__updateReady = true;
        }
      }
      function watch(worker) {
        if (!worker) return;
        // It may ALREADY be installed by the time we attach — statechange
        // would then never fire and the update would sit there unannounced.
        ready(worker);
        worker.addEventListener('statechange', function () { ready(worker); });
      }
      if (registration.waiting && navigator.serviceWorker.controller) {
        window.__waitingWorker = registration.waiting;
        window.__updateReady = true;
      }
      watch(registration.installing);
      registration.addEventListener('updatefound', function () {
        watch(registration.installing);
      });
    }).catch(function () { /* offline first load: the app still runs */ });
    // On the FIRST visit the worker activates and claims immediately, which
    // also fires controllerchange — reloading then would bounce a cold start.
    var hadController = !!navigator.serviceWorker.controller;
    var reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!hadController || reloading) return;
      reloading = true;
      window.location.reload();
    });
  }

  // Measure the real safe-area insets (CSS px == dp for Compose) and hand
  // them to the wasm app, which pads its content accordingly.
  function computeSafeInsets() {
    const probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;left:0;width:0;pointer-events:none;visibility:hidden;' +
      'top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);';
    document.body.appendChild(probe);
    const rect = probe.getBoundingClientRect();
    window.__safeTop = rect.top;
    window.__safeBottom = Math.max(0, window.innerHeight - rect.bottom);
    probe.remove();
  }
  computeSafeInsets();
  window.addEventListener('resize', computeSafeInsets);

  // ---- iOS keyboard inset (setup-and-home §S3, defect #7) ----------------
  // iOS Safari overlays the software keyboard on the LAYOUT viewport instead
  // of resizing it, and the Compose canvas is position:fixed;inset:0 — so the
  // lower seat-name fields end up underneath the keyboard. visualViewport is
  // the only thing that sees it; the app pads its root by this value.
  function computeKeyboardInset() {
    const vv = window.visualViewport;
    window.__keyboardInset = vv
      ? Math.max(0, window.innerHeight - vv.height - vv.offsetTop) : 0;
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', computeKeyboardInset);
    window.visualViewport.addEventListener('scroll', computeKeyboardInset);
  }
  computeKeyboardInset();

  // ---- wake lock across tab switches (setup-and-home #41) ---------------
  // Browsers drop the screen wake lock whenever the page is hidden, so an app
  // switch or an auto-lock puts the grimoire back to sleep. Re-ask on every
  // return to visibility; the Compose seam owns the first request.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    try { if (navigator.wakeLock) navigator.wakeLock.request('screen'); } catch (e) {}
    computeKeyboardInset();
  });
</script>
<script src="grimoire.js"></script>
</body>
</html>
