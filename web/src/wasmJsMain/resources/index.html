<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Clocktower Grimoire</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grimoire">
<meta name="theme-color" content="#0E0A14">
<link rel="apple-touch-icon" href="appicon.png">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0E0A14; overflow: hidden; }
  /* Full-bleed canvas; the measured safe-area insets are passed INTO
     Compose (window.__safeTop/__safeBottom) so the app paints its own
     background under the notch and pads its content — no black bands,
     no content under the status bar or home indicator. */
  #compose {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    outline: none;
    /* Let Compose own every gesture: no browser pinch/double-tap zoom,
       no grey tap flashes, no accidental text selection. */
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  #boot {
    position: fixed; inset: 0; display: flex; flex-direction: column; gap: 10px;
    align-items: center; justify-content: center;
    color: #D9B45B; font-family: Georgia, serif; font-size: 22px;
  }
  #boot small { color: #B9AECB; font-size: 13px; }
</style>
</head>
<body>
<div id="boot">Opening the grimoire…<small>first load fetches the whole app; later loads are instant</small><small>build __BUILD__</small></div>
<canvas id="compose"></canvas>
<script>
  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
  // Measure the real safe-area insets (CSS px == dp for Compose) and hand
  // them to the wasm app, which pads its content accordingly.
  function computeSafeInsets() {
    const probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;left:0;width:0;pointer-events:none;visibility:hidden;' +
      'top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);';
    document.body.appendChild(probe);
    const rect = probe.getBoundingClientRect();
    window.__safeTop = rect.top;
    window.__safeBottom = Math.max(0, window.innerHeight - rect.bottom);
    probe.remove();
  }
  computeSafeInsets();
  window.addEventListener('resize', computeSafeInsets);
  // iOS Safari leaves a synthetic "mouse" parked on the last touch point,
  // so buttons keep their hover/pressed tint after a tap. When the last
  // finger lifts, walk the phantom cursor off-screen.
  window.addEventListener('touchend', (e) => {
    if (e.touches.length === 0) {
      setTimeout(() => {
        const canvas = document.getElementById('compose');
        if (canvas) {
          canvas.dispatchEvent(new PointerEvent('pointermove', {
            clientX: -1000, clientY: -1000, bubbles: true, pointerType: 'mouse',
          }));
        }
      }, 80);
    }
  }, { passive: true });
</script>
<script src="grimoire.js"></script>
</body>
</html>
