<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Clocktower Grimoire</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grimoire">
<meta name="theme-color" content="#0E0A14">
<link rel="apple-touch-icon" href="appicon.png">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0E0A14; overflow: hidden; }
  /* Keep the canvas out of the iPhone status bar / home indicator:
     standalone PWAs render edge-to-edge, so inset by the safe areas. */
  #compose {
    position: fixed;
    left: env(safe-area-inset-left, 0px);
    right: env(safe-area-inset-right, 0px);
    top: env(safe-area-inset-top, 0px);
    bottom: env(safe-area-inset-bottom, 0px);
    width: calc(100vw - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
    height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    outline: none;
    /* Let Compose own every gesture: no browser pinch/double-tap zoom,
       no grey tap flashes, no accidental text selection. */
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  #boot {
    position: fixed; inset: 0; display: flex; flex-direction: column; gap: 10px;
    align-items: center; justify-content: center;
    color: #D9B45B; font-family: Georgia, serif; font-size: 22px;
  }
  #boot small { color: #B9AECB; font-size: 13px; }
</style>
</head>
<body>
<div id="boot">☾ Opening the grimoire…<small>first load fetches the whole app; later loads are instant</small></div>
<canvas id="compose"></canvas>
<script>
  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
  // iOS Safari leaves a synthetic "mouse" parked on the last touch point,
  // so buttons keep their hover/pressed tint after a tap. When the last
  // finger lifts, walk the phantom cursor off-screen.
  window.addEventListener('touchend', (e) => {
    if (e.touches.length === 0) {
      setTimeout(() => {
        const canvas = document.getElementById('compose');
        if (canvas) {
          canvas.dispatchEvent(new PointerEvent('pointermove', {
            clientX: -1000, clientY: -1000, bubbles: true, pointerType: 'mouse',
          }));
        }
      }, 80);
    }
  }, { passive: true });
</script>
<script src="grimoire.js"></script>
</body>
</html>
