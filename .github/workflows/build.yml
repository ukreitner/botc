name: Build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engine-tests:
    name: Engine rules & data tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: ./gradlew :engine:test

  ui-typecheck:
    name: Compose UI typecheck (no Android SDK needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: gradle -p tools/uicheck compileKotlin

  web:
    name: Build & deploy web app (PWA)
    # Pages hosts one site; deploy only from the active development branch.
    if: github.ref_name == 'claude/clocktower-grimoire-android-0bz090'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Restore cached character art
        uses: actions/cache/restore@v4
        with:
          path: app/src/main/assets/icons
          key: icons-v1-${{ github.run_id }}-web
          restore-keys: icons-v1-
      - name: Fetch official character art
        run: bash tools/fetch-icons.sh
      - name: Build WebAssembly distribution
        run: gradle -p web wasmJsBrowserDistribution
      - name: Assemble PWA site
        run: |
          mkdir -p site/data site/icons
          cp -r web/build/dist/wasmJs/productionExecutable/* site/
          cp engine/src/main/resources/botc/data/*.json site/data/
          cp app/src/main/assets/icons/* site/icons/
          sed -i "s/__BUILD__/${GITHUB_SHA}/" site/sw.js
          convert -size 512x512 xc:'#0E0A14' \
            \( -size 480x480 xc:none -fill none -stroke '#D9B45B' -strokewidth 14 \
               -draw 'circle 240,240 240,30' \) -gravity center -composite \
            -fill '#D9B45B' -font DejaVu-Serif -pointsize 260 -gravity center \
            -annotate +0+10 'G' site/appicon.png \
            || cp site/icons/imp.png site/appicon.png
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

  apk:
    name: Assemble & publish debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # The wiki fallback for newer characters is flaky; keep every icon we
      # have ever fetched in the actions cache so a bad wiki day can never
      # regress the APK's art. Unique key per run + prefix restore = the
      # newest cache wins and the set only ever grows.
      - name: Restore cached character art
        uses: actions/cache/restore@v4
        with:
          path: app/src/main/assets/icons
          key: icons-v1-${{ github.run_id }}
          restore-keys: icons-v1-
      - name: Fetch official character art
        run: bash tools/fetch-icons.sh
      - name: Save character art cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: app/src/main/assets/icons
          key: icons-v1-${{ github.run_id }}
      # ubuntu-latest runners ship with the Android SDK preinstalled and
      # licenses accepted; AGP fetches the exact platform it needs.
      - run: ./gradlew :app:assembleDebug
      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: clocktower-grimoire-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to the rolling "latest-apk" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk clocktower-grimoire.apk
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk clocktower-grimoire.apk \
            --title "Clocktower Grimoire (latest build)" \
            --notes "Debug APK built from ${{ github.sha }} on branch ${{ github.ref_name }}. Download clocktower-grimoire.apk below and open it on your phone to install." \
            --prerelease \
            --target ${{ github.sha }}
