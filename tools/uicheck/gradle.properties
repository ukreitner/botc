# Standalone build (its own settings.gradle.kts), so the root gradle.properties
# does not apply here. The typecheck compiles every app + engine source in one
# module; the Kotlin daemon needs real heap or CI dies with "GC overhead limit
# exceeded" during IR lowering.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g
kotlin.code.style=official
